allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  workerd: true

# Kobalte's first build for stable Solid 2 is younger than the default release
# age; the earlier alphas require a Solid 2 release candidate.
minimumReleaseAgeExclude:
  - '@kobalte/core@2.0.0-alpha.5'
  - '@kobalte/utils@2.0.0-alpha.2'
